name: Build WF

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main
  
  workflow_dispatch:
  
  # schedule:
  #   - cron: "0 2 * * *" 

permissions:
  contents: read
  
jobs:

  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if Builds fails
        if: failure()
        run: echo "Buiold job failed! Please check logs"

  Testing:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        if: github.ref == 'ref/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'ref/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Run tests on other brnaches
        if: github.ref == 'ref/heads/main'
        run: echo "Skipping unit tests and code analysis"
  
  Security_Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Runt Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          vuln-type: 'os,library'
          output: 'trivy-results.json'

      - name: Upload trivy scan results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json
